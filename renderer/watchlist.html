<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Watchlist Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🎬 Movie Watchlist Management</h1>

    <div class="container">
        <h3 id="form-title" style="margin-top:0; color:#38bdf8;">Add Movie Review</h3>

        <input type="hidden" id="editIndex" value="-1">

        <input type="text" id="movieTitle" placeholder="Movie Title" style="background:#0f172a; color:#f6f7f8;">
        <input type="text" id="movieGenre" placeholder="Genre" style="background:#0f172a; color:#f6f7f8;">
        <textarea id="movieNotes" rows="4" placeholder="Write your review..."></textarea>
        
        <button id="saveBtn">💾 Save Movie Review</button>
    </div>

    <h2 style="text-align: center; margin-top: 35px; color: #f1f5f9;">Saved Watchlist</h2>
    
    <div style="max-width: 900px; margin: 0 auto;">
        <table>
            <thead>
                <tr><th>Title</th><th>Genre</th><th>Review</th><th>Actions</th></tr>
            </thead>
            <tbody id="watchlistBody"></tbody>
        </table>
    </div>

    <script src="watchlist.js"></script>
</body>
</html>
